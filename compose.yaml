name: video-url-download

services:
  api:
    image: "${API_IMAGE:-ghcr.io/qinbatista/video-url-download:latest}"
    build:
      context: .
      target: runtime
    container_name: video-url-download
    restart: unless-stopped
    stop_grace_period: 15m
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    volumes:
      - video_url_download_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  test:
    build:
      context: .
      target: test
    env_file:
      - .env
    environment:
      DATA_DIR: /tmp/test-data
    profiles:
      - test

  proxy:
    image: "${CADDY_IMAGE:-caddy:2}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PROXY_HOSTNAME: "${PROXY_HOSTNAME:-la.qyp.life}"
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "8787:8787"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    profiles:
      - proxy

volumes:
  video_url_download_data:
  caddy_data:
  caddy_config:

name: video-url-download

services:
  api:
    build:
      context: .
      target: runtime
    container_name: video-url-download
    restart: unless-stopped
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    volumes:
      - video_url_download_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  test:
    build:
      context: .
      target: test
    env_file:
      - .env
    environment:
      DATA_DIR: /tmp/test-data
    profiles:
      - test

volumes:
  video_url_download_data:
